    <rect x="631" y="116" width="74" height="43" rx="10" fill="#131A1D" stroke="#334155"/>
    <text x="668" y="142"
          text-anchor="middle"
          fill="#E2E8F0"
          font-family="Consolas, monospace"
          font-size="10">
      PAYMENT
    </text>
  </g>

  <!-- DB connections -->
  <g stroke="#475569" stroke-width="1.2">
    <path d="M446 159V184"/>
    <path d="M520 159V184"/>
    <path d="M594 159V184"/>
    <path d="M668 159V184"/>
  </g>

  <!-- databases -->
  <g fill="#151B20" stroke="#334155">
    <ellipse cx="446" cy="190" rx="28" ry="9"/>
    <ellipse cx="520" cy="190" rx="28" ry="9"/>
    <ellipse cx="594" cy="190" rx="28" ry="9"/>
    <ellipse cx="668" cy="190" rx="28" ry="9"/>
  </g>

  <g fill="#94A3B8" font-family="Consolas, monospace" font-size="9" text-anchor="middle">
    <text x="446" y="194">DB</text>
    <text x="520" y="194">DB</text>
    <text x="594" y="194">DB</text>
    <text x="668" y="194">DB</text>
  </g>

  <circle cx="556" cy="96" r="4" fill="#F59E0B"/>
  <circle cx="594" cy="96" r="3" fill="#22C55E"/>
