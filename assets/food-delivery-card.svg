    <rect x="483" y="116" width="74" height="43" rx="10" fill="#131A1D" stroke="#334155"/>
    <text x="520" y="142"
          text-anchor="middle"
          fill="#E2E8F0"
          font-family="Consolas, monospace"
          font-size="10">
      RESTAURANT
    </text>

    <rect x="557" y="116" width="74" height="43" rx="10" fill="#131A1D" stroke="#334155"/>
    <text x="594" y="142"
          text-anchor="middle"
          fill="#E2E8F0"
          font-family="Consolas, monospace"
          font-size="10">
