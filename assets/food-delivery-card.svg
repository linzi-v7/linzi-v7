<svg width="720" height="250" viewBox="0 0 720 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="250">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#121A20"/>
    </linearGradient>

    <linearGradient id="accent" x1="420" y1="40" x2="670" y2="210">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="718" height="248" rx="18" fill="url(#bg)" stroke="#273244"/>

  <!-- subtle grid -->
  <g opacity="0.07" stroke="#94A3B8">
    <path d="M0 50H720"/>
    <path d="M0 100H720"/>
    <path d="M0 150H720"/>
    <path d="M0 200H720"/>
    <path d="M90 0V250"/>
    <path d="M180 0V250"/>
    <path d="M270 0V250"/>
    <path d="M360 0V250"/>
    <path d="M450 0V250"/>
    <path d="M540 0V250"/>
    <path d="M630 0V250"/>
  </g>

  <rect x="32" y="34" width="4" height="178" rx="2" fill="url(#accent)"/>

  <text x="55" y="72"
        fill="#F8FAFC"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="28"
        font-weight="700">
    Food Delivery
  </text>

  <text x="55" y="100"
        fill="#94A3B8"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="14">
    Microservice architecture experiment
  </text>

  <text x="55" y="139"
        fill="#CBD5E1"
        font-family="Consolas, monospace"
        font-size="13">
    gateway   Nginx
  </text>

  <text x="55" y="163"
        fill="#CBD5E1"
        font-family="Consolas, monospace"
        font-size="13">
    services  Node.js / TypeScript
  </text>

  <text x="55" y="187"
        fill="#CBD5E1"
        font-family="Consolas, monospace"
        font-size="13">
    infra     Docker / Kubernetes
  </text>

  <text x="55" y="211"
        fill="#64748B"
        font-family="Consolas, monospace"
        font-size="12">
    database-per-service · JWT · React
  </text>

  <!-- gateway -->
  <rect x="472" y="35" width="168" height="38" rx="10" fill="#151B20" stroke="#F59E0B"/>
  <text x="556" y="59"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="Consolas, monospace"
        font-size="12"
        font-weight="700">
    NGINX GATEWAY
  </text>

  <!-- lines -->
  <g stroke="#475569" stroke-width="1.5">
    <path d="M556 73V96"/>
    <path d="M556 96H446V116"/>
    <path d="M556 96H520V116"/>
    <path d="M556 96H594V116"/>
    <path d="M556 96H668V116"/>
  </g>

  <!-- services -->
  <g>
    <rect x="409" y="116" width="74" height="43" rx="10" fill="#131A1D" stroke="#334155"/>
    <text x="446" y="142"
          text-anchor="middle"
          fill="#E2E8F0"
          font-family="Consolas, monospace"
          font-size="10">
