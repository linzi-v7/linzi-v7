<svg width="720" height="250" viewBox="0 0 720 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="250">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#121826"/>
    </linearGradient>

    <linearGradient id="accent" x1="420" y1="60" x2="650" y2="200">
      <stop stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="718" height="248" rx="18" fill="url(#bg)" stroke="#273244"/>

  <!-- subtle grid -->
  <g opacity="0.07" stroke="#94A3B8">
    <path d="M0 50H720"/>
    <path d="M0 100H720"/>
    <path d="M0 150H720"/>
    <path d="M0 200H720"/>
    <path d="M90 0V250"/>
    <path d="M180 0V250"/>
    <path d="M270 0V250"/>
    <path d="M360 0V250"/>
    <path d="M450 0V250"/>
    <path d="M540 0V250"/>
    <path d="M630 0V250"/>
  </g>

  <!-- left accent -->
  <rect x="32" y="34" width="4" height="178" rx="2" fill="url(#accent)"/>

  <text x="55" y="72"
        fill="#F8FAFC"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="28"
        font-weight="700">
    Questify
  </text>

  <text x="55" y="100"
        fill="#94A3B8"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="14">
    Gamified learning platform
  </text>

  <text x="55" y="139"
        fill="#CBD5E1"
        font-family="Consolas, monospace"
        font-size="13">
    mobile    Expo / React Native
  </text>

  <text x="55" y="163"
        fill="#CBD5E1"
        font-family="Consolas, monospace"
        font-size="13">
    backend   Express / Prisma / PostgreSQL
  </text>

  <text x="55" y="187"
        fill="#CBD5E1"
        font-family="Consolas, monospace"
        font-size="13">
    ai        generation / RAG / course Q&amp;A
  </text>

  <text x="55" y="211"
        fill="#64748B"
        font-family="Consolas, monospace"
        font-size="12">
    monorepo · progression · jobs · admin
  </text>

  <!-- architecture diagram -->
  <g stroke-width="1.5">
    <path d="M485 74L555 116" stroke="#475569"/>
    <path d="M485 158L555 116" stroke="#475569"/>
    <path d="M555 116L630 83" stroke="#475569"/>
    <path d="M555 116L630 157" stroke="#475569"/>
  </g>

  <!-- Mobile -->
  <g>
    <rect x="424" y="52" width="120" height="44" rx="11" fill="#131A26" stroke="#334155"/>
    <circle cx="443" cy="74" r="5" fill="#8B5CF6"/>
    <text x="456" y="79"
          fill="#E2E8F0"
          font-family="Consolas, monospace"
          font-size="12">
      Mobile
    </text>
  </g>

  <!-- Admin -->
  <g>
    <rect x="424" y="136" width="120" height="44" rx="11" fill="#131A26" stroke="#334155"/>
    <circle cx="443" cy="158" r="5" fill="#38BDF8"/>
    <text x="456" y="163"
          fill="#E2E8F0"
          font-family="Consolas, monospace"
          font-size="12">
      Admin
    </text>
  </g>

  <!-- API -->
  <g filter="url(#glow)">
    <rect x="520" y="94" width="104" height="44" rx="11" fill="#161B29" stroke="url(#accent)"/>
  </g>

  <text x="555" y="121"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="Consolas, monospace"
        font-size="12"
        font-weight="700">
    API
  </text>

  <!-- DB -->
  <g>
    <rect x="608" y="61" width="78" height="44" rx="11" fill="#131A26" stroke="#334155"/>
    <text x="647" y="88"
          text-anchor="middle"
          fill="#CBD5E1"
          font-family="Consolas, monospace"
          font-size="11">
      Postgres
    </text>
  </g>

  <!-- AI -->
  <g>
    <rect x="608" y="136" width="78" height="44" rx="11" fill="#131A26" stroke="#334155"/>
    <text x="647" y="163"
          text-anchor="middle"
          fill="#CBD5E1"
          font-family="Consolas, monospace"
          font-size="11">
      AI / RAG
    </text>
  </g>

  <circle cx="555" cy="116" r="4" fill="#A78BFA"/>
</svg>