<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 196" width="868" height="196" role="img" aria-label="Malaf: An offline-first clinic app. Patient records stay encrypted on the doctor's own PC.">
<style>
.m{font:500 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.08em;fill:#59636e}
